[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice"
version = "0.1.0"
description = "PyTorch toolkit for neural networks, supervised training, and reinforcement learning"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.7,<3",
    "gymnasium>=1.3,<2",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
]
modern-env = ["gymnasium[mujoco]>=1.3,<2", "mujoco>=3.3,<4"]
robotics = ["gymnasium-robotics>=1.4,<2"]
offline = ["minari>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["lattice*"]
